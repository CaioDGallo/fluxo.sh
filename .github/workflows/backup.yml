name: Database Backup

on:
  schedule:
    # Daily at 6am UTC (3am BRT)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Create backup
        run: |
          pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            | gzip -9 > backup_$(date +%Y-%m-%d).sql.gz
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_DIRECT_URL }}

      - name: Upload backup to Cloudflare R2
        run: |
          BACKUP_FILE="backup_$(date +%Y-%m-%d).sql.gz"
          aws s3 cp "$BACKUP_FILE" \
            "s3://$R2_BUCKET_NAME/backups/$BACKUP_FILE" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"

          # Verify upload succeeded
          if [ $? -eq 0 ]; then
            echo "✓ Backup uploaded successfully: $BACKUP_FILE"
          else
            echo "✗ Backup upload failed"
            exit 1
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
