name: Database Backup

on:
  schedule:
    # Daily at 6am UTC (3am BRT)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Create backup with pg_dump
        uses: tj-actions/pg-dump@v3
        with:
          database_url: ${{ secrets.SUPABASE_DB_DIRECT_URL }}
          postgresql_version: "17"
          path: "backup_${{ github.run_id }}.sql"
          options: "--no-owner --no-privileges --clean --if-exists"

      - name: Compress backup
        run: gzip -9 "backup_${{ github.run_id }}.sql"

      - name: Upload backup to Cloudflare R2
        run: |
          BACKUP_FILE="backup_${{ github.run_id }}.sql.gz"
          REMOTE_NAME="backup_$(date +%Y-%m-%d)_${{ github.run_id }}.sql.gz"

          aws s3 cp "$BACKUP_FILE" \
            "s3://$R2_BUCKET_NAME/backups/$REMOTE_NAME" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"

          # Verify upload succeeded
          if [ $? -eq 0 ]; then
            echo "✓ Backup uploaded successfully: $REMOTE_NAME"
          else
            echo "✗ Backup upload failed"
            exit 1
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
